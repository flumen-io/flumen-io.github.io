<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>交流会 出欠（10/29）</title>
<style>
  :root { --ink:#1f2a33; --sub:#5d6b77; --line:#d5dde3; --bg:#f6f8f9; --card:#fff;
          --yes:#1f7a5a; --no:#a23b3b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; line-height:1.7; }
  main { max-width:480px; margin:0 auto; padding:40px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:28px 24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .meta { color:var(--sub); font-size:14px; margin:0 0 24px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=text] { width:100%; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:24px 0 8px; }
  .choices button { font-size:18px; font-weight:700; padding:18px 0; border-radius:8px;
                    border:2px solid; background:#fff; cursor:pointer; }
  .yes { color:var(--yes); border-color:var(--yes); }
  .no  { color:var(--no);  border-color:var(--no); }
  .yes:hover { background:var(--yes); color:#fff; }
  .no:hover  { background:var(--no);  color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { min-height:1.7em; font-size:14px; color:var(--no); margin:8px 0 0; }
  .done { text-align:center; padding:24px 0; }
  .done p { margin:0; }
  .done .big { font-size:20px; font-weight:700; margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>iRIC講習会 交流会 出欠</h1>
    <p class="meta">10月29日（木）講習会初日終了後／回答締切 10月15日（木）</p>

    <form id="rsvp">
      <label for="name">お名前</label>
      <input type="text" id="name" name="name" autocomplete="name" required>
      <div class="choices">
        <button type="submit" class="yes" value="参加">〇 参加</button>
        <button type="submit" class="no" value="不参加">× 不参加</button>
      </div>
      <p class="msg" id="msg"></p>
    </form>

    <div class="done" id="done" hidden>
      <p class="big" id="done-text"></p>
      <p>ご回答ありがとうございました。</p>
    </div>
  </div>
</main>
<script>
  // Formspreeで作ったフォームのID（https://formspree.io/f/ のあとの部分）
  const FORM_ID = "xwlvrory";

  const form = document.getElementById("rsvp");
  const msg = document.getElementById("msg");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = form.name.value.trim();
    if (!name) { msg.textContent = "お名前を入力してください。"; return; }
    const answer = e.submitter.value;
    const buttons = form.querySelectorAll("button");
    buttons.forEach(b => b.disabled = true);
    msg.textContent = "";
    try {
      const res = await fetch("https://formspree.io/f/" + FORM_ID, {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify({ 名前: name, 回答: answer, _subject: "【" + answer + "】交流会10/29 " + name }),
      });
      if (!res.ok) throw new Error();
      form.hidden = true;
      document.getElementById("done-text").textContent = name + " 様：" + answer;
      document.getElementById("done").hidden = false;
    } catch {
      msg.textContent = "送信できませんでした。時間をおいてもう一度押してください。";
      buttons.forEach(b => b.disabled = false);
    }
  });
</script>
</body>
</html>
